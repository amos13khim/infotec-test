services:
  db:
    image: mysql:8.0
    container_name: books_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: books_catalog
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --require_secure_transport=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s

  app:
    build:
      context: ./app
    container_name: books_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_DSN: mysql:host=db;port=3306;dbname=books_catalog
      DB_USERNAME: app
      DB_PASSWORD: app
      COOKIE_VALIDATION_KEY: books-catalog-cookie-key-12345
      SMSPILOT_API_KEY: emulator
      SMSPILOT_MODE: emulator
      SMSPILOT_SENDER: BooksCatalog

volumes:
  mysql_data:
